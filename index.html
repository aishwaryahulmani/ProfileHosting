<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #3b82f6;
            --primary-dark: #2563eb;
            --text: #1e293b;
            --text-light: #64748b;
            --background: #f8fafc;
            --card: #ffffff;
            --border: #e2e8f0;
            --accent: #f97316;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background-color: var(--background);
            color: var(--text);
            line-height: 1.5;
            padding: 16px;
            max-width: 100%;
            overflow-x: hidden;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        .profile-card {
            background-color: var(--card);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        .profile-header {
            background: linear-gradient(to right, var(--primary), var(--primary-dark));
            padding: 24px 20px;
            color: white;
            text-align: center;
            position: relative;
        }

        .profile-initials {
            width: 80px;
            height: 80px;
            background-color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            color: var(--primary);
            font-size: 28px;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .profile-name {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .profile-title {
            font-size: 16px;
            opacity: 0.9;
        }

        .profile-body {
            padding: 24px 20px;
        }

        .section {
            margin-bottom: 24px;
        }

        .section:last-child {
            margin-bottom: 0;
        }

        .section-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
        }

        .section-title i {
            margin-right: 8px;
        }

        .summary {
            background-color: rgba(59, 130, 246, 0.05);
            padding: 16px;
            border-radius: 8px;
            border-left: 3px solid var(--primary);
        }

        .info-list {
            list-style: none;
        }

        .info-item {
            display: flex;
            align-items: flex-start;
            margin-bottom: 16px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
        }

        .info-item:last-child {
            margin-bottom: 0;
            padding-bottom: 0;
            border-bottom: none;
        }

        .info-icon {
            color: var(--primary);
            font-size: 18px;
            margin-right: 12px;
            width: 24px;
            text-align: center;
        }

        .info-content {
            flex: 1;
        }

        .info-label {
            font-size: 14px;
            color: var(--text-light);
            margin-bottom: 2px;
        }

        .info-value {
            font-size: 16px;
            word-break: break-word;
        }

        .contact-button {
            display: block;
            background-color: var(--accent);
            color: white;
            text-align: center;
            padding: 14px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            margin-top: 24px;
            transition: background-color 0.2s;
        }

        .contact-button:hover, .contact-button:focus {
            background-color: #ea580c;
        }

        .loading {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-light);
        }

        .error {
            background-color: #fee2e2;
            border-left: 3px solid #ef4444;
            padding: 16px;
            border-radius: 8px;
            margin: 20px 0;
            color: #b91c1c;
        }

        @media (min-width: 640px) {
            body {
                padding: 24px;
            }

            .profile-header {
                padding: 32px 24px;
            }

            .profile-body {
                padding: 32px 24px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="loading" class="loading">
            <i class="fas fa-circle-notch fa-spin"></i> Loading profile...
        </div>
        
        <div id="error" class="error" style="display: none;">
            Could not load profile information. Please try again later.
        </div>
        
        <div id="profile-card" class="profile-card" style="display: none;">
            <div class="profile-header">
                <div class="profile-initials" id="initials"></div>
                <h1 class="profile-name" id="fullName"></h1>
                <!-- <div class="profile-title" id="profileTitle"></div> -->
            </div>
            
            <div class="profile-body">
                <div class="section">
                    <h2 class="section-title"><i class="fas fa-user"></i> About</h2>
                    <div class="summary" id="summary"></div>
                </div>
                
                <div class="section">
                    <h2 class="section-title"><i class="fas fa-address-card"></i> Contact Information</h2>
                    <ul class="info-list">
                        <li class="info-item">
                            <div class="info-icon">
                                <i class="fas fa-envelope"></i>
                            </div>
                            <div class="info-content">
                                <div class="info-label">Email</div>
                                <div class="info-value" id="email"></div>
                            </div>
                        </li>
                        <li class="info-item">
                            <div class="info-icon">
                                <i class="fas fa-phone"></i>
                            </div>
                            <div class="info-content">
                                <div class="info-label">Phone</div>
                                <div class="info-value" id="phone"></div>
                            </div>
                        </li>
                        <li class="info-item">
                            <div class="info-icon">
                                <i class="fas fa-map-marker-alt"></i>
                            </div>
                            <div class="info-content">
                                <div class="info-label">Location</div>
                                <div class="info-value" id="location"></div>
                            </div>
                        </li>
                    </ul>
                </div>
                
                <a href="#" class="contact-button" id="contactBtn">Contact Me</a>
            </div>
        </div>
    </div>

    <script>
        // Get user ID from URL
        function getUserIdFromUrl() {
            // Get the ID from URL parameters
            const urlParams = new URLSearchParams(window.location.search);
            const id = urlParams.get('id');
            
            // If no ID in URL, try to get it from the path
            if (!id) {
                const pathParts = window.location.pathname.split('/');
                return pathParts[pathParts.length - 1];
            }
            
            return id;
        }

        // Fetch user data from API
        async function fetchUserData(id) {
            try {
                const response = await fetch(`https://job-fvr7.onrender.com/api/auth/publicUser/${id}`);
                
                if (!response.ok) {
                    throw new Error('Failed to fetch user data');
                }
                
                return await response.json();
            } catch (error) {
                console.error('Error fetching user data:', error);
                throw error;
            }
        }

        // Update UI with user data
        function updateUI(userData) {
            // Set full name
            document.getElementById('fullName').textContent = `${userData.firstName} ${userData.lastName}`;
            
            // Set initials
            const initials = `${userData.firstName.charAt(0)}${userData.lastName.charAt(0)}`;
            document.getElementById('initials').textContent = initials;
            
            // Set profile title
            document.getElementById('profileTitle').textContent = userData.summary;
            
            // Set summary
            document.getElementById('summary').textContent = userData.summary;
            
            // Set contact information
            document.getElementById('email').textContent = userData.email;
            document.getElementById('phone').textContent = userData.phone;
            document.getElementById('location').textContent = userData.location;
            
            // Set contact button
            document.getElementById('contactBtn').href = `mailto:${userData.email}`;
            
            // Hide loading, show profile
            document.getElementById('loading').style.display = 'none';
            document.getElementById('profile-card').style.display = 'block';
        }

        // Show error message
        function showError() {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('error').style.display = 'block';
        }

        // Initialize the page
        async function initPage() {
            const userId = getUserIdFromUrl();
            
            if (!userId) {
                showError();
                document.getElementById('error').textContent = 'No user ID provided. Please check the URL.';
                return;
            }
            
            try {
                const userData = await fetchUserData(userId);
                updateUI(userData);
            } catch (error) {
                showError();
            }
        }

        // Start the app when DOM is loaded
        document.addEventListener('DOMContentLoaded', initPage);

        // For testing purposes - if API call fails, use this sample data
        window.addEventListener('error', function() {
            const sampleData = {
                "firstName": "Aishwarya",
                "lastName": "Hulmani",
                "email": "aishwaryahulmani2668@gmail.com",
                "phone": 9164693037,
                "location": "hubli",
                "summary": "ui/ux designer"
            };
            
            updateUI(sampleData);
        });
    </script>
</body>
</html>
