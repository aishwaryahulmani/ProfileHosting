<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Profile</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <style>
    body {
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f6f8;
      margin: 0;
      padding: 0;
    }

    .container {
      max-width: 800px;
      margin: 30px auto;
      padding: 20px;
    }

    .loading,
    .error {
      text-align: center;
      font-size: 1.2rem;
      padding: 20px;
      color: #555;
    }

    .error {
      color: red;
    }

    .profile-card {
      background-color: white;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      overflow: hidden;
      transition: all 0.3s ease-in-out;
    }

    .profile-header {
      background: linear-gradient(to right, #4a90e2, #007aff);
      color: white;
      padding: 40px 30px 30px;
      text-align: center;
    }

    .profile-initials {
      width: 80px;
      height: 80px;
      margin: 0 auto 10px;
      background-color: rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      font-size: 2.5rem;
      line-height: 80px;
      font-weight: bold;
    }

    .profile-name {
      font-size: 2rem;
      font-weight: bold;
      margin: 0;
    }

    .profile-body {
      padding: 30px;
    }

    .section {
      margin-bottom: 30px;
    }

    .section-title {
      font-size: 1.3rem;
      font-weight: bold;
      color: #333;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
    }

    .section-title i {
      margin-right: 10px;
      color: #007aff;
    }

    .summary {
      font-size: 1.05rem;
      color: #444;
      line-height: 1.5;
    }

    .info-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .info-item {
      display: flex;
      align-items: flex-start;
      margin-bottom: 15px;
    }

    .info-icon {
      font-size: 1.3rem;
      color: #007aff;
      width: 30px;
      margin-right: 15px;
    }

    .info-content {
      flex: 1;
    }

    .info-label {
      font-weight: bold;
      margin-bottom: 5px;
      color: #333;
    }

    .info-value {
      color: #555;
    }

    .contact-button {
      display: inline-block;
      background-color: #007aff;
      color: white;
      padding: 10px 25px;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
      transition: background-color 0.2s ease-in-out;
      margin-top: 10px;
    }

    .contact-button:hover {
      background-color: #005bb5;
    }

    @media (max-width: 600px) {
      .profile-header {
        padding: 30px 20px 20px;
      }

      .profile-name {
        font-size: 1.5rem;
      }

      .section-title {
        font-size: 1.1rem;
      }

      .profile-initials {
        width: 60px;
        height: 60px;
        font-size: 2rem;
        line-height: 60px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div id="loading" class="loading">
      <i class="fas fa-circle-notch fa-spin"></i> Loading profile...
    </div>

    <div id="error" class="error" style="display: none;">
      Could not load profile information. Please try again later.
    </div>

    <div id="profile-card" class="profile-card" style="display: none;">
      <div class="profile-header">
        <div class="profile-initials" id="initials"></div>
        <h1 class="profile-name" id="fullName"></h1>
      </div>

      <div class="profile-body">
        <div class="section">
          <h2 class="section-title"><i class="fas fa-user"></i> About</h2>
          <div class="summary" id="summary"></div>
        </div>

        <div class="section">
          <h2 class="section-title"><i class="fas fa-address-card"></i> Contact Information</h2>
          <ul class="info-list">
            <li class="info-item">
              <div class="info-icon"><i class="fas fa-envelope"></i></div>
              <div class="info-content">
                <div class="info-label">Email</div>
                <div class="info-value" id="email"></div>
              </div>
            </li>
            <li class="info-item">
              <div class="info-icon"><i class="fas fa-phone"></i></div>
              <div class="info-content">
                <div class="info-label">Phone</div>
                <div class="info-value" id="phone"></div>
              </div>
            </li>
            <li class="info-item">
              <div class="info-icon"><i class="fas fa-map-marker-alt"></i></div>
              <div class="info-content">
                <div class="info-label">Location</div>
                <div class="info-value" id="location"></div>
              </div>
            </li>
          </ul>
        </div>

        <a href="#" class="contact-button" id="contactBtn">Contact Me</a>
      </div>
    </div>
  </div>

  <script>
    function getUserIdFromUrl() {
      const urlParams = new URLSearchParams(window.location.search);
      const id = urlParams.get('id');
      if (!id) {
        const pathParts = window.location.pathname.split('/');
        return pathParts[pathParts.length - 1];
      }
      return id;
    }

    async function fetchUserDataWithRetry(id, retries = 3) {
      for (let i = 0; i < retries; i++) {
        try {
          const res = await fetch(`https://job-fvr7.onrender.com/api/auth/publicUser/${id}`);
          if (!res.ok) throw new Error('Failed to fetch');
          return await res.json();
        } catch (err) {
          if (i === retries - 1) throw err;
          await new Promise(resolve => setTimeout(resolve, 1000)); // wait 1s
        }
      }
    }

    function updateUI(userData) {
      document.getElementById('fullName').textContent = `${userData.firstName} ${userData.lastName}`;
      document.getElementById('initials').textContent = `${userData.firstName[0]}${userData.lastName[0]}`;
      document.getElementById('summary').textContent = userData.summary || 'No summary provided.';
      document.getElementById('email').textContent = userData.email;
      document.getElementById('phone').textContent = userData.phone;
      document.getElementById('location').textContent = userData.location;
      document.getElementById('contactBtn').href = `mailto:${userData.email}`;

      document.getElementById('loading').style.display = 'none';
      document.getElementById('profile-card').style.display = 'block';
    }

    function showError(message) {
      document.getElementById('loading').style.display = 'none';
      const errorDiv = document.getElementById('error');
      errorDiv.style.display = 'block';
      if (message) errorDiv.textContent = message;
    }

    async function initPage() {
      const userId = getUserIdFromUrl();
      if (!userId) {
        showError('No user ID provided. Please check the URL.');
        return;
      }

      try {
        const userData = await fetchUserDataWithRetry(userId);
        updateUI(userData);
      } catch (err) {
        showError('Could not load profile information. Please try again later.');
        console.error('Fetch error:', err);
      }
    }

    document.addEventListener('DOMContentLoaded', initPage);
  </script>
</body>
</html>
